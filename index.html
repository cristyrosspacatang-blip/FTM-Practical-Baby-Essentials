<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Practical Baby Finds</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* Custom scrollbar utility */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <header class="bg-white border-b border-pink-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-pink-400 text-white font-bold flex items-center justify-center text-xl shadow-md">
          Mommy
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">My Practical Baby Finds</h1>
          <p class="text-xs text-slate-500">Curated essentials for first-time moms! ✨</p>
        </div>
      </div>
      <button id="adminToggleBtn" onclick="openAdminLogin()" class="text-slate-400 hover:text-pink-500 p-2 transition">
        <i class="fa-solid fa-lock text-lg"></i>
      </button>
    </div>
  </header>

  <nav class="bg-white border-b border-slate-100 py-3 sticky top-[73px] z-20 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar scroll-smooth" id="categoryContainer">
      <!-- Generated dynamically by JS -->
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- Admin Toolbar (Visible when logged in) -->
    <div id="adminBar" class="hidden mb-6 bg-pink-50 border border-pink-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-2 text-pink-700 font-medium text-sm">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Mode Active (Live Syncing)</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openProductModal()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add New Product
        </button>
        <button onclick="logoutAdmin()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition">
          Logout
        </button>
      </div>
    </div>

    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading placeholder state -->
      <div class="col-span-full py-12 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 text-pink-400"></i>
        <p>Loading live baby finds...</p>
      </div>
    </div>
  </main>

  <div id="productModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h2 id="modalTitle" class="text-xl font-bold text-slate-900 mb-4">Add New Product</h2>
      
      <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-4">
        <input type="hidden" id="productId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Product Title</label>
          <input type="text" id="productTitle" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
          <select id="productCategory" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
            <option value="Feeding Essentials">Feeding Essentials</option>
            <option value="Laundry Essentials">Laundry Essentials</option>
            <option value="Helpful Needs">Helpful Needs</option>
            <option value="My Reviews & Videos">My Reviews & Videos</option>
            <option value="Diapering Essentials">Diapering Essentials</option>
            <option value="Clothes & Apparel">Clothes & Apparel</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL</label>
          <input type="url" id="productImage" required placeholder="https://..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Shopee Link (Optional)</label>
          <input type="url" id="shopeeUrl" placeholder="https://shope.ee/..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">TikTok Shop Link (Optional)</label>
          <input type="url" id="tiktokUrl" placeholder="https://vt.tiktok.com/..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>

        <button type="submit" id="saveBtn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-xl shadow-md transition mt-2">
          Save Product
        </button>
      </form>
    </div>
  </div>

  <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 mt-auto">
    <p>© Mommy's Practical Baby Finds • Live Sync Active</p>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC51idfw9hvc6BkRGV1CDGz9NTNPlk0lGQ",
      authDomain: "mommy-finds.firebaseapp.com",
      projectId: "mommy-finds",
      storageBucket: "mommy-finds.firebasestorage.app",
      messagingSenderId: "754624081001",
      appId: "1:754624081001:web:cecd2f0b1d84ad998d06f8",
      measurementId: "G-0HEWF1TZYF"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let products = [];
    let selectedCategory = "All Items";
    let isAdmin = localStorage.getItem("mommyAdmin") === "true";

    const categories = [
      "All Items",
      "Feeding Essentials",
      "Laundry Essentials",
      "Helpful Needs",
      "My Reviews & Videos",
      "Diapering Essentials"
    ];

    const initialProducts = [
      {
        title: "Unilove New Born Diaper",
        category: "Diapering Essentials",
        image: "https://cf.shopee.ph/file/ph-11134207-7r98o-lst1w10p4aep5c",
        shopeeUrl: "https://shopee.ph",
        tiktokUrl: "https://tiktok.com"
      },
      {
        title: "Baby Bath Tub",
        category: "Helpful Needs",
        image: "https://cf.shopee.ph/file/ph-11134207-7qul3-lhx02m4x29g1a9",
        shopeeUrl: "https://shopee.ph",
        tiktokUrl: "https://tiktok.com"
      },
      {
        title: "Baby Bath Towel with Hood",
        category: "Helpful Needs",
        image: "https://cf.shopee.ph/file/ph-11134207-7qul6-li22m0s4r9l02b",
        shopeeUrl: "https://shopee.ph",
        tiktokUrl: "https://tiktok.com"
      },
      {
        title: "Aveeno Baby Hair and Body Wash",
        category: "Helpful Needs",
        image: "https://cf.shopee.ph/file/ph-11134207-7qul5-lh1l1g52s4j42a",
        shopeeUrl: "https://shopee.ph",
        tiktokUrl: "https://tiktok.com"
      },
      {
        title: "Moose Gear Baby Wipes Premium Unscented",
        category: "Diapering Essentials",
        image: "https://cf.shopee.ph/file/ph-11134207-7qul2-lg04y3e8a4a58b",
        shopeeUrl: "https://shopee.ph",
        tiktokUrl: "https://tiktok.com"
      }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      renderCategories();
      updateAdminUI();
      listenToFirestore();
    });

    function listenToFirestore() {
      db.collection("products").onSnapshot((snapshot) => {
        if (snapshot.empty) {
          initialProducts.forEach(prod => {
            db.collection("products").add({ ...prod, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          });
        } else {
          products = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          renderProducts();
        }
      }, (error) => {
        console.error("Firestore Error: ", error);
      });
    }

    function renderCategories() {
      const container = document.getElementById("categoryContainer");
      container.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
          selectedCategory === cat 
            ? "bg-pink-500 text-white shadow-sm" 
            : "bg-slate-100 text-slate-600 hover:bg-slate-200"
        }">
          ${cat}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const filtered = selectedCategory === "All Items" 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p>No items found in this category yet.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between relative group hover:shadow-md transition">
          ${isAdmin ? `
            <div class="absolute top-3 right-3 z-10 flex gap-2 bg-white/90 backdrop-blur-xs p-1.5 rounded-full shadow-md">
              <button onclick="openProductModal('${item.id}')" class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center hover:bg-blue-600 transition">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button onclick="deleteProduct('${item.id}')" class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          ` : ''}
          <div>
            <div class="aspect-square w-full rounded-2xl overflow-hidden bg-pink-50 mb-3">
              <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300?text=Baby+Item'">
            </div>
            <h3 class="font-bold text-slate-800 text-sm mb-3 line-clamp-2">${item.title}</h3>
          </div>
          <div class="space-y-2 mt-auto">
            ${item.shopeeUrl ? `
              <a href="${item.shopeeUrl}" target="_blank" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-xs transition">
                <i class="fa-solid fa-bag-shopping"></i> Shopee
              </a>
            ` : ''}
            ${item.tiktokUrl ? `
              <a href="${item.tiktokUrl}" target="_blank" class="w-full bg-slate-900 hover:bg-black text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-xs transition">
                <i class="fa-brands fa-tiktok"></i> TikTok
              </a>
            ` : ''}
          </div>
        </div>
      `).join("");
    }

    function openAdminLogin() {
      if (isAdmin) return;
      const pass = prompt("Enter secret admin password:");
      if (pass === "mommy2024") {
        isAdmin = true;
        localStorage.setItem("mommyAdmin", "true");
        updateAdminUI();
        renderProducts();
      } else if (pass !== null) {
        alert("Incorrect password!");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.removeItem("mommyAdmin");
      updateAdminUI();
      renderProducts();
    }

    function updateAdminUI() {
      const adminBar = document.getElementById("adminBar");
      if (isAdmin) {
        adminBar.classList.remove("hidden");
      } else {
        adminBar.classList.add("hidden");
      }
    }

    function openProductModal(id = null) {
      const modal = document.getElementById("productModal");
      const title = document.getElementById("modalTitle");
      
      if (id) {
        const item = products.find(p => p.id === id);
        if (!item) return;
        document.getElementById("productId").value = item.id;
        document.getElementById("productTitle").value = item.title;
        document.getElementById("productCategory").value = item.category;
        document.getElementById("productImage").value = item.image;
        document.getElementById("shopeeUrl").value = item.shopeeUrl || '';
        document.getElementById("tiktokUrl").value = item.tiktokUrl || '';
        title.innerText = "Edit Product";
      } else {
        document.getElementById("productForm").reset();
        document.getElementById("productId").value = '';
        title.innerText = "Add New Product";
      }
      modal.classList.remove("hidden");
    }

    function closeProductModal() {
      document.getElementById("productModal").classList.add("hidden");
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving to Database...";

      const id = document.getElementById("productId").value;
      const data = {
        title: document.getElementById("productTitle").value,
        category: document.getElementById("productCategory").value,
        image: document.getElementById("productImage").value,
        shopeeUrl: document.getElementById("shopeeUrl").value,
        tiktokUrl: document.getElementById("tiktokUrl").value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (id) {
          await db.collection("products").doc(id).update(data);
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection("products").add(data);
        }
        closeProductModal();
      } catch (err) {
        alert("Error saving product: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Product";
      }
    }

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        try {
          await db.collection("products").doc(id).delete();
        } catch (err) {
          alert("Error deleting product: " + err.message);
        }
      }
    }
  </script>
</body>
</html>
